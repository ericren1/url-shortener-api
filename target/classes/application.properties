spring.application.name=url-shortener-api

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/url_shortener}
spring.datasource.username=${DB_USERNAME:url_shortener}
spring.datasource.password=${DB_PASSWORD:url_shortener_dev}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Actuator
management.endpoints.web.exposure.include=health,info